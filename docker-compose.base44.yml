services:
  web:
    image: node:22-slim
    working_dir: /app
    # Dependencies live in a named volume, so they are installed after the mount
    # is in place and re-synced from package.json on every start.
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        exec npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # bind-mounted sources: rely on polling so edits trigger a rebuild
      - WATCHPACK_POLLING=true
      # supplied by the Base44 platform; gates the preview-origin allowance in
      # next.config.mjs (unset keeps stock Next.js behaviour)
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    restart: on-failure
    labels:
      base44.project: AnimeForge
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  node_modules:
